; Generic parallel-port (LPT/Centronics) WiFi print server on ESP32-S3
; Project: fork of gianluca-nitti/printserver-esp8266 ported to ESP32-S3.
; Same flat layout as the original project: all sources live next to
; printserver.ino in this folder (no src/ subdirectory). PlatformIO's
; default src_dir is "src", so we point it back at this folder and
; exclude what is not firmware code (tests, firmware binaries, docs).
; Build:  cd printserver && pio run
; Arduino IDE 2: open printserver/printserver.ino
[platformio]
default_envs = esp32s3
src_dir = .

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
src_filter = +<*.cpp> +<*.h> +<*.ino> -<tests/> -<firmware/>
board_build.partitions = partitions-16mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O2
lib_deps =
    olikraus/U8g2 @ 2.35.30
